<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/brand/log.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (text shows in a fallback font, then swaps) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:wght@400;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Manrope:wght@400..800&family=Poppins:wght@400;500;600&family=Raleway:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:wght@400;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Manrope:wght@400..800&family=Poppins:wght@400;500;600&family=Raleway:wght@400;500;600;700&display=swap" /></noscript>

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <meta name="description" content="NestFinder Pro: find, rent and buy homes across Nigeria." />
    <meta name="theme-color" content="#1A3C34" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NestFinder Pro" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="NestFinder Pro" />
    <meta property="og:description" content="Find, rent and buy verified homes across Nigeria." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the saved theme before first paint so there is no white flash in dark mode -->
    <script>
      try {
        var t = localStorage.getItem('nestfinder_theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
      } catch (e) {}
    </script>
    <title>NestFinder Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
